<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="300" rx="16" fill="#0e1524"/>
  <text x="30" y="36" font-size="16" font-weight="700" fill="#e6eaf2">One mission, hour by hour</text>
  <text x="970" y="36" text-anchor="end" fill="#8a96ad">10 days at one site</text>
  <text x="30" y="78" fill="#8a96ad">Sunlight</text>
  <rect x="140" y="64" width="830" height="20" rx="4" fill="#151e31"/>
  <g fill="#f5a524">
    <rect x="140" y="64" width="150" height="20" rx="4"/><rect x="330" y="64" width="120" height="20" rx="4"/>
    <rect x="560" y="64" width="190" height="20" rx="4"/><rect x="810" y="64" width="160" height="20" rx="4"/>
  </g>
  <text x="30" y="118" fill="#8a96ad">Earth link</text>
  <g>
    <rect x="140" y="104" width="230" height="20" rx="4" fill="#3b82f6"/>
    <rect x="370" y="104" width="60" height="20" fill="#f59e0b"/>
    <rect x="430" y="104" width="130" height="20" fill="#ef4444"/>
    <rect x="560" y="104" width="50" height="20" fill="#f59e0b"/>
    <rect x="610" y="104" width="360" height="20" rx="4" fill="#3b82f6"/>
  </g>
  <text x="30" y="200" fill="#8a96ad">Battery</text>
  <line x1="140" y1="232" x2="970" y2="232" stroke="#ef4444" stroke-dasharray="6 5" stroke-opacity="0.8"/>
  <text x="966" y="250" text-anchor="end" fill="#ef4444" font-size="12">safe reserve</text>
  <path d="M140 160 L290 150 L330 185 L450 162 L560 222 L750 158 L810 176 L970 150" fill="none" stroke="#22c55e" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="560" cy="222" r="6" fill="#f59e0b"/>
  <text x="548" y="228" text-anchor="end" fill="#f59e0b" font-size="12">lowest point</text>
  <text x="140" y="282" fill="#8a96ad">Charge in sunlight, drain in shadow, talk to Earth when it is above the ridge. Drop below the reserve and the plan fails.</text>
</svg>